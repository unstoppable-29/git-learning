name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-to-prod:
    # THIS IS THE MAGIC WORD: It tells GitHub to use VM 1 instead of their cloud servers
    runs-on: self-hosted 
    
    steps:
      - name: Download my code
        uses: actions/checkout@v4
        
      - name: Deploy to VM 2
        # This uses the secure SSH bridge we built earlier!
        # StrictHostKeyChecking=no prevents the pipeline from getting stuck asking "Are you sure you want to connect?"
        run: |
          scp -o StrictHostKeyChecking=no index.html hulk@132.1.16.119:/var/www/html/index.html